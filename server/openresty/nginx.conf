worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    upstream fairdeck_api {
        least_conn;
        server 127.0.0.1:8811 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8812 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    server {
        listen 80;
        server_name blockchain.xialiwei.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name blockchain.xialiwei.com;
        ssl_certificate /etc/letsencrypt/live/blockchain.xialiwei.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/blockchain.xialiwei.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            limit_req zone=api burst=20 nodelay;
            access_by_lua_block {
                -- Only public API surface; operator writes stay on the local interface.
                if ngx.var.uri:find("^/v1/operator/") then return ngx.exit(403) end
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_pass http://fairdeck_api;
        }
    }
}
