worker_processes 1;
events { worker_connections 512; }
http {
    server_tokens off;
    access_log off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    upstream fairdeck {
        least_conn;
        server 127.0.0.1:8811 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8812 max_fails=3 fail_timeout=10s;
    }
    server {
        listen 127.0.0.1:8890;
        server_name blockchain.xialiwei.com;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Real-IP;
        location / {
            limit_req zone=api burst=20 nodelay;
            access_by_lua_block {
                if ngx.var.uri:find("^/v1/operator/") then return ngx.exit(403) end
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_pass http://fairdeck;
        }
    }
}
