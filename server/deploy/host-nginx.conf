server {
    listen 80;
    server_name blockchain.xialiwei.com;
    return 301 https://blockchain.xialiwei.com$request_uri;
}
server {
    listen 443 ssl;
    server_name blockchain.xialiwei.com;
    ssl_certificate /etc/letsencrypt/live/xialiwei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xialiwei.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_pass http://127.0.0.1:8890;
    }
}
